services:
  limbus:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: limbus-app
    restart: always
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
    env_file:
      - backend/.env
    volumes:
      - .:/app
      - /app/backend/node_modules
      - ./backend/snapshots:/app/backend/snapshots
